[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-mcp"
version = "0.1.0"
description = "Web interface with local AI models and MCP tools for civil engineering software."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "mcp>=1.12,<2",
    "python-dotenv>=1.0,<2",
    "pywin32>=306; sys_platform == 'win32'",
    "uvicorn[standard]>=0.34,<1",
    "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
]

[project.scripts]
ia-mcp-agent = "ia_mcp.agent.local_agent:main"
ia-mcp-relay = "ia_mcp.relay.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ia_mcp.web" = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requiere Microsoft Word instalado y COM disponible en Windows",
]
