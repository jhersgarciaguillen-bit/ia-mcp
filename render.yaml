services:
  - type: web
    name: ia-mcp-relay
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: IA_MCP_AGENT_TOKEN
        generateValue: true
      - key: IA_MCP_RELAY_CLIENT_TOKEN
        generateValue: true
